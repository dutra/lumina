[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumina"
version = "0.1.0"
description = "Cluster strong-lensing inference utilities."
requires-python = ">=3.11"
dependencies = [
    "astropy>=8.0.0",
    "blackjax>=1.5",
    "graphviz>=0.21",
    "h5py>=3.8",
    "jax>=0.4",
    "jaxtronomy @ git+https://github.com/lenstronomy/JAXtronomy.git@main",
    "lenstronomy @ git+https://github.com/lenstronomy/lenstronomy.git@main",
    "matplotlib>=3.7",
    "numpyro>=0.15",
    "cmcrameri>=1.8",
    "photutils>=2.0",
    "PyYAML>=6",
    "rich>=13",
    "scikit-image>=0.22",
    "scipy>=1.10",
    "tqdm>=4.66",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-xdist>=3",
]

[project.scripts]
lumina = "lumina.cli:main"
lumina-mock = "lumina.mock_validation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lumina = ["plotting/style.mplstyle", "data/*.csv", "data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: validation tests that run inference or require a full JAX runtime, end-to-end pipeline runs, and wall-clock timing tests",
    "timing: wall-clock timing tests, which depend on the machine and are not run on shared runners",
]
