name: Run benchmarks for PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  likelihood-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          path: benchmark-head
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout base
        uses: actions/checkout@v4
        with:
          path: benchmark-base
          ref: ${{ github.event.pull_request.base.sha || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: benchmark-head/pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e benchmark-head

      # Base and PR run in alternating rounds (base, PR, PR, base, base, PR, ...), each run a fresh process, so a slow
      # spell of the shared runner lands on both sides instead of looking like a code change. The per-evaluation
      # timings are milliseconds; the scatter between rounds is what limits the comparison, hence fewer repeats per run.
      - name: Run likelihood benchmarks
        env:
          LENSCLUSTER_BENCH_ROUNDS: "3"
          LENSCLUSTER_BENCH_REPEATS: "20"
          LENSCLUSTER_BENCH_TRIALS: "3"
          LENSCLUSTER_BENCH_LBFGS_ITERS: "25"
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: |
          mkdir -p benchmark-artifacts/runs
          script=benchmark-head/benchmarks/lenscluster_pr_benchmark.py
          base_sha="$(git -C benchmark-base rev-parse HEAD)"
          head_sha="$(git -C benchmark-head rev-parse HEAD)"

          # The base keeps its own dependency pins. With the same pyproject.toml on both sides the installed dependencies
          # serve both, and each run imports its own checkout through PYTHONPATH; otherwise every switch of side
          # reinstalls that checkout first. Either way each run records the lumina it imported, which compare checks.
          # The inputs come from the PR checkout so both sides see the same catalogs.
          if cmp -s benchmark-base/pyproject.toml benchmark-head/pyproject.toml; then switch=pythonpath; else switch=reinstall; fi
          echo "Switching between base and PR by ${switch}."

          bench() {
            local side="$1" round="$2" root sha
            if [ "$side" = base ]; then root=benchmark-base; sha="$base_sha"; else root=benchmark-head; sha="$head_sha"; fi
            if [ "$switch" = reinstall ] && [ "$installed" != "$root" ]; then
              pip install -e "$root" || return 1
              installed="$root"
            fi
            PYTHONPATH="$root/src" python "$script" run \
              --output-dir "benchmark-artifacts/runs/$side-$round" \
              --label "$side" \
              --round "$round" \
              --sha "$sha" \
              --checkout "$root" \
              --catalog-root benchmark-head
          }

          installed=benchmark-head
          base_failed=0
          for round in $(seq 1 "$LENSCLUSTER_BENCH_ROUNDS"); do
            # A base that fails once fails every round, so stop after the PR run of that round.
            [ "$base_failed" = 0 ] || break
            if [ $((round % 2)) = 1 ]; then order="base pr"; else order="pr base"; fi
            for side in $order; do
              if [ "$side" = pr ]; then
                bench pr "$round"
              elif ! bench base "$round"; then
                base_failed=1
                echo "::warning::Base benchmark failed in round ${round}; the comment will show PR timings only."
              fi
            done
          done

          PYTHONPATH=benchmark-head/src python "$script" compare \
            --runs-dir benchmark-artifacts/runs \
            --base-root benchmark-base \
            --head-root benchmark-head \
            --rounds "$LENSCLUSTER_BENCH_ROUNDS" \
            --output-dir benchmark-artifacts
          cat benchmark-artifacts/output >> "$GITHUB_STEP_SUMMARY"

      - name: Store PR number
        run: |
          printf "%s" "${{ github.event.pull_request.number || 0 }}" > benchmark-artifacts/pr

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts
          path: benchmark-artifacts/
